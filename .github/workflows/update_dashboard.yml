name: Update Market Dashboard

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/30 * * * *'  # Rulează la fiecare 30 de minute (mod: portfolio)
    - cron: '0 */5 * * *'   # Rulează la fiecare 5 ore (mod: all)
  workflow_dispatch:
    inputs:
      push_test_symbol:
        description: 'Simbol pentru un push de test; gol rulează scannerul'
        required: false
        default: ''
        type: string
      push_test_registration_token:
        description: 'Token FCM pentru țintire directă'
        required: false
        default: ''
        type: string
      update_mode:
        description: 'Tipul actualizării manuale'
        required: false
        default: 'portfolio'
        type: choice
        options:
          - portfolio
          - all
          - ro

concurrency:
  group: market-dashboard-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite roboțelului să salveze fișierele generate

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install pandas requests yfinance ib_insync beautifulsoup4 lxml pycryptodome -r requirements.txt

    - name: Send Firebase BUY push test
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_test_symbol != '' }}
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        FIREBASE_REGISTRATION_TOKENS: ${{ secrets.FIREBASE_REGISTRATION_TOKENS }}
        FIREBASE_SITE_URL: https://ddanyro.github.io/market-scanner/
        PUSH_TEST_SYMBOL: ${{ inputs.push_test_symbol }}
        PUSH_TEST_REGISTRATION_TOKEN: ${{ inputs.push_test_registration_token || secrets.FIREBASE_REGISTRATION_TOKENS }}
      run: |
        python buy_now_push.py \
          --test-symbol "$PUSH_TEST_SYMBOL" \
          --registration-token "$PUSH_TEST_REGISTRATION_TOKEN"

    - name: Retry pending Firebase BUY alerts
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_test_symbol == '' }}
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        FIREBASE_REGISTRATION_TOKENS: ${{ secrets.FIREBASE_REGISTRATION_TOKENS }}
        FIREBASE_SITE_URL: https://ddanyro.github.io/market-scanner/
      run: python buy_now_push.py --retry-state dashboard_state.json

    - name: Run Market Scanner
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_test_symbol == '' }}
      env:
        TZ: 'Europe/Bucharest'
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} # Optional/Deprecated
        IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
        IBKR_QUERY_ID: ${{ secrets.IBKR_QUERY_ID }}
        PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
        PORTFOLIO_CHAT_API_URL: ${{ secrets.PORTFOLIO_CHAT_API_URL }}
        TWS_ACCOUNT_PASSWORD: ${{ secrets.TWS_ACCOUNT_PASSWORD }}
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        FIREBASE_REGISTRATION_TOKENS: ${{ secrets.FIREBASE_REGISTRATION_TOKENS }}
        FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        FIREBASE_SITE_URL: https://ddanyro.github.io/market-scanner/
      run: |
        MODE="portfolio"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          MODE="${{ inputs.update_mode }}"
        elif [ "${{ github.event.schedule }}" = "0 */5 * * *" ]; then
          MODE="all"
        fi
        echo "Running market scanner in mode: $MODE"
        python update_sp500_json.py
        python market_scanner.py --mode $MODE

    - name: Commit and Push changes
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_test_symbol == '' }}
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add index.html dashboard_state.json portfolio.csv watchlist.csv sp500_tickers.json tws_account.enc.json tws_account_risk.json push/firebase/firebase-messaging-sw.js
        if [ -f bvb_daily_cache.csv ]; then git add bvb_daily_cache.csv; fi
        git commit -m "Auto-update Dashboard [skip ci]" || echo "No changes to commit"
        git push origin HEAD:main || (git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main)
