name: Deploy Portfolio AI Chat (Cloudflare)

on:
  push:
    branches: ["main"]
    paths:
      - "workers/portfolio-chat/**"
      - ".github/workflows/deploy_portfolio_chat.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-ai-chat-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/portfolio-chat/package-lock.json

      - name: Install and test Worker
        working-directory: workers/portfolio-chat
        run: npm ci && npm test

      - name: Deploy Cloudflare Worker with encrypted secrets
        working-directory: workers/portfolio-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
        run: |
          jq -n \
            --arg openai "$OPENAI_API_KEY" \
            --arg password "$PORTFOLIO_PASSWORD" \
            '{OPENAI_API_KEY:$openai,PORTFOLIO_PASSWORD:$password}' \
            > "$RUNNER_TEMP/portfolio-chat-secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/portfolio-chat-secrets.json"
