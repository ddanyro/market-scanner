name: Deploy Portfolio AI Chat (Cloudflare)

on:
  push:
    branches: ["main"]
    paths:
      - "workers/portfolio-chat/**"
      - ".github/workflows/deploy_portfolio_chat.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-ai-chat-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/portfolio-chat/package-lock.json

      - name: Install and test Worker
        working-directory: workers/portfolio-chat
        run: npm ci && npm test

      - name: Deploy Cloudflare Worker with encrypted secrets
        working-directory: workers/portfolio-chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          SHADOW_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHADOW_R2_ACCESS_KEY_ID: ${{ secrets.SHADOW_R2_ACCESS_KEY_ID }}
          SHADOW_R2_SECRET_ACCESS_KEY: ${{ secrets.SHADOW_R2_SECRET_ACCESS_KEY }}
        run: |
          jq -n \
            --arg openai "$OPENAI_API_KEY" \
            --arg password "$PORTFOLIO_PASSWORD" \
            --arg r2account "$SHADOW_R2_ACCOUNT_ID" \
            --arg r2access "$SHADOW_R2_ACCESS_KEY_ID" \
            --arg r2secret "$SHADOW_R2_SECRET_ACCESS_KEY" \
            '{OPENAI_API_KEY:$openai,PORTFOLIO_PASSWORD:$password,SHADOW_R2_ACCOUNT_ID:$r2account,SHADOW_R2_ACCESS_KEY_ID:$r2access,SHADOW_R2_SECRET_ACCESS_KEY:$r2secret}' \
            > "$RUNNER_TEMP/portfolio-chat-secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/portfolio-chat-secrets.json"

      - name: Verify the live authenticated AI chat
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          CHAT_URL: https://market-scanner-portfolio-chat.daniel-dragomir.workers.dev/
        run: |
          cleanup() {
            rm -f "$RUNNER_TEMP/portfolio-chat-smoke.json" "$RUNNER_TEMP/portfolio-chat-response.json" "$RUNNER_TEMP/portfolio-chat-secrets.json" "$RUNNER_TEMP/runtime-dashboard.html"
          }
          trap cleanup EXIT
          runtime_url="${CHAT_URL%/}/runtime/index.html"
          dashboard_status="$(curl -sS --compressed -o "$RUNNER_TEMP/runtime-dashboard.html" -w '%{http_code}' "$runtime_url" -H 'Origin: https://ddanyro.github.io')"
          test "$dashboard_status" = "200"
          grep -q '<title>Market Scanner' "$RUNNER_TEMP/runtime-dashboard.html"
          python -c 'import hashlib,hmac,json,os,pathlib; password=os.environ["PORTFOLIO_PASSWORD"]; token=hmac.new(password.encode(),b"market-scanner-portfolio-chat-v1",hashlib.sha256).hexdigest(); payload={"message":"Răspunde numai cu textul: Chat AI funcțional.","context":{"smoke_test":True},"history":[],"accessToken":token}; pathlib.Path(os.environ["RUNNER_TEMP"],"portfolio-chat-smoke.json").write_text(json.dumps(payload),encoding="utf-8")'
          # Allow the newly deployed version to reach workers.dev before testing it.
          sleep 5
          preflight_status="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$CHAT_URL" -H 'Origin: https://ddanyro.github.io' -H 'Access-Control-Request-Method: POST')"
          test "$preflight_status" = "204"
          chat_status="$(curl -sS -o "$RUNNER_TEMP/portfolio-chat-response.json" -w '%{http_code}' -X POST "$CHAT_URL" -A 'Mozilla/5.0' -H 'Origin: https://ddanyro.github.io' -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/portfolio-chat-smoke.json")"
          if [ "$chat_status" != "200" ]; then
            printf 'Portfolio chat smoke test returned HTTP %s: ' "$chat_status"
            jq -r '(.error // "răspuns fără mesaj de eroare") + (if .reason then " [" + .reason + "]" else "" end)' "$RUNNER_TEMP/portfolio-chat-response.json"
            exit 1
          fi
          if ! jq -e '(.text | type == "string" and length > 0) and (.model | type == "string" and length > 0) and .provider == "openai" and .degraded == false' "$RUNNER_TEMP/portfolio-chat-response.json" > /dev/null; then
            printf 'Portfolio chat is reachable, but the OpenAI provider check failed: '
            jq -c '{provider, degraded, reason, notice}' "$RUNNER_TEMP/portfolio-chat-response.json"
            exit 1
          fi
