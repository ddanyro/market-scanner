name: Migrate Shadow History to R2

on:
  workflow_dispatch:

concurrency:
  group: market-dashboard-writes
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SHADOW_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHADOW_R2_ACCESS_KEY_ID: ${{ secrets.SHADOW_R2_ACCESS_KEY_ID }}
      SHADOW_R2_SECRET_ACCESS_KEY: ${{ secrets.SHADOW_R2_SECRET_ACCESS_KEY }}
      SHADOW_R2_BUCKET: market-scanner-shadow
      SHADOW_R2_PREFIX: market-scanner-shadow/v1
      SHADOW_R2_REQUIRED: "true"
    steps:
      - name: Checkout complete shadow history
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install migration dependencies
        run: pip install -r requirements.txt

      - name: Migrate immutable snapshots
        run: python shadow_parquet_store.py migrate

      - name: Verify every local snapshot exists in R2
        run: python shadow_parquet_store.py verify
